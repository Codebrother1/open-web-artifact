name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - '22'
          - '24'
    steps:
      - name: Preserve repository bytes on every OS
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Versions
        run: node --version

      - name: Prove this is the offline lane
        run: node .github/scripts/assert-no-live-config.mjs

      - name: Repository tests
        run: npm test

      - name: Auth tests
        run: npm run test:auth

      - name: Security tests
        run: npm run test:security

      - name: Conformance tests
        run: npm run test:conformance

      - name: Property tests
        run: npm run test:property

      - name: Integrity tests
        run: npm run test:integrity

      - name: GC tests
        run: npm run test:gc

      - name: Integration harness
        run: npm run test:integration:harness

      - name: Live integration suite is unconfigured and must skip
        run: npm run test:integration

      - name: Install MCP dependencies
        run: npm --prefix packages/mcp ci --ignore-scripts

      - name: MCP tests
        run: npm run test:mcp

      - name: Whitespace check
        run: git diff --check

      - name: Tests left the checkout clean
        run: node .github/scripts/assert-clean-tree.mjs
